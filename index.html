<style>
/* Layout: a night-game control room. The top stays put (app bar, then the tabs); only the page under the
   tabs scrolls, and each tab keeps its own scroll spot. Swipe or tap between Zone | Matchup | Games.
   From 900px wide the tabs sit side by side as columns (2 up to 1199px, 3 from 1200px). */
:root {
  --turf: #0e1411; --panel: #161f1a; --panel-2: #1c2721; --line: #2a372f;
  --chalk: #e8eee9; --mute: #8d9c92; --field: #1d3527; --field-line: #2f4c3a;
  --you: #f2c230; --you-ink: #1a1400; --you-tint: rgb(242 194 48 / .14);
  --opp: #ab8cf6; --opp-tint: rgb(171 140 246 / .14);
  --up: #43d17e; --down: #f2645d; --hot: #ff5a4e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --turf: #f2f5f1; --panel: #ffffff; --panel-2: #f5f8f4; --line: #d9e1da;
  --chalk: #111a14; --mute: #56665b; --field: #d6e9da; --field-line: #b4d2bb;
  --you: #a87b00; --you-ink: #fffbea; --you-tint: rgb(168 123 0 / .12);
  --opp: #6a4bd3; --opp-tint: rgb(106 75 211 / .1);
  --up: #13894a; --down: #c7372f; --hot: #d42a1f; color-scheme: light; } }
:root[data-theme="light"] {
  --turf: #f2f5f1; --panel: #ffffff; --panel-2: #f5f8f4; --line: #d9e1da;
  --chalk: #111a14; --mute: #56665b; --field: #d6e9da; --field-line: #b4d2bb;
  --you: #a87b00; --you-ink: #fffbea; --you-tint: rgb(168 123 0 / .12);
  --opp: #6a4bd3; --opp-tint: rgb(106 75 211 / .1);
  --up: #13894a; --down: #c7372f; --hot: #d42a1f; color-scheme: light; }

/* The page around the app never scrolls. The top/bottom safe areas are padded once, by the page's host
   (and server.js) on :root; the sides by the content's own gutters (--gut-l / --gut-r). */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { background: var(--turf); }
body { margin: 0; background: var(--turf); color: var(--chalk); font: 15px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:active { opacity: .75; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---- Shell: app bar · pin bar · rail · tabs · pages ---- */
.shell { position: relative; height: 100%; overflow: hidden; display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto auto minmax(0, 1fr);
  grid-template-areas: "bar" "pin" "rail" "tabs" "main"; }
.pinbar { grid-area: pin; height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 var(--gut-r) 0 var(--gut-l); background: var(--panel); border-bottom: 1px solid var(--line); }
.pin-open { flex: 1 1 auto; min-width: 0; height: 36px; display: flex; align-items: center; gap: 8px; background: none; border: 0; text-align: left; white-space: nowrap; overflow: hidden; }
.pin-open > * { pointer-events: none; }
.pin-l { font: 700 11px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--you); }
.pin-t { font: 600 14px/1 var(--display); letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; }
.pin-x { flex: none; width: 36px; height: 36px; background: none; border: 0; font-size: 20px; color: var(--mute); }
.pinbtn { flex: none; padding: 6px 10px; } .pinbtn[aria-pressed="true"] { background: var(--you); color: var(--you-ink); border-color: var(--you); }
.shell.dash .pinbtn { display: none; }
.main { grid-area: main; min-height: 0; position: relative; }
.alert { grid-row: main-start / main-end; grid-column: 1; align-self: start; justify-self: center; width: min(100% - 32px, 480px); margin-top: 6px; position: relative; z-index: 9; }

/* ---- App bar ---- */
.appbar { grid-area: bar; position: relative; z-index: 6; display: flex; align-items: center; gap: 2px; height: 51px; padding: 0 var(--gut-r) 3px var(--gut-l); background: var(--turf); }
.winbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--opp); }
.winbar span { display: block; height: 100%; width: 50%; background: var(--you); transition: width .5s; }
.winbar.off { background: var(--line); } .winbar.off span { width: 0; }
.appbar .score { flex: 1 1 auto; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 0; background: none; border: 0; text-align: left; white-space: nowrap; overflow: hidden; }
.appbar .score > * { pointer-events: none; }
.appbar .score .brand { font: 700 20px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.appbar .score .brand b { color: var(--you); }
.appbar .score .sb { display: inline-flex; align-items: baseline; gap: 5px; }
.appbar .score .sbn { font: 700 21px/1 var(--display); }
.appbar .score .me .sbn { color: var(--you); } .appbar .score .opp .sbn { color: var(--opp); }
.appbar .score .sbw { font: 600 11px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.appbar .score .sbw .long { display: none; }
.appbar .score .sbp { display: none; font: 600 11px/1 var(--display); letter-spacing: 0.04em; color: var(--mute); }
.appbar .score .sbwp { display: inline-flex; align-items: baseline; gap: 4px; font: 700 16px/1 var(--display); }
.appbar .score .sbwp .sbw { display: none; }
@media (max-width: 399px) { .appbar .score .sb .sbw { display: none; } .appbar .score { gap: 6px; } .appbar .score .sbn { font-size: 19px; } .appbar .score .sbwp { font-size: 15px; } }
@media (max-width: 430px) { .tbtn, .iconbtn { min-width: 34px; padding: 0 3px; } .iconbtn.more { min-width: 36px; } .clockpill { min-width: 0; margin: 0; padding: 0 7px; } .appbar .score { padding-right: 4px; } }
@media (max-width: 399px) { .clockpill > svg:last-child { display: none; } }
@media (max-width: 379px) { .appbar .score .sbwp { display: none; } } /* the yellow/purple bar under the top still shows who's winning */
@media (max-width: 349px) { .appbar .score .sbn { font-size: 18px; } .appbar .score .sbwp { font-size: 14px; } .appbar .score { gap: 6px; } }
.transport { display: flex; align-items: center; gap: 2px; flex: none; }
.tbtn, .iconbtn { flex: none; height: 44px; min-width: 40px; display: inline-grid; place-items: center; padding: 0 6px; background: none; border: 0; border-radius: 8px; font: 700 16px/1 var(--display); letter-spacing: 0.02em; }
.iconbtn.more { min-width: 40px; }
@media (hover: hover) { .tbtn:hover, .iconbtn:hover { background: var(--panel); } }
.clockpill { flex: none; height: 32px; min-width: 56px; margin: 0 2px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font: 700 15px/1 var(--display); letter-spacing: 0.02em; position: relative; }
.clockpill::after, .livepill::after { content: ""; position: absolute; inset: -6px 0; } /* 44px tap target */
.clockpill .cp-i { display: none; }
.clockpill > * { pointer-events: none; }
@media (max-width: 339px) { .clockpill { min-width: 40px; padding: 0 6px; } .clockpill .cp-t { display: none; } .clockpill .cp-i { display: inline-grid; } }
.livepill { position: relative; flex: none; height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font: 700 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.livepill i { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.livepill.on { color: var(--chalk); } .livepill.on i { background: var(--hot); animation: pulse 1.6s infinite; }
.livepill.off { color: var(--down); border-color: var(--down); } .livepill.off i { background: var(--down); }
@keyframes pulse { 50% { opacity: 0.25; } }
.transport .speeds { display: none; }
@media (min-width: 900px) {
  .transport .speeds { display: inline-flex; margin: 0 4px; } .transport .speedcycle { display: none; }
  .appbar .score { gap: 14px; } .appbar .score .sbp { display: inline; } .appbar .score .sbwp .sbw { display: inline; }
  .appbar .score .sbw .long { display: inline; } .appbar .score .sbw .short { display: none; }
}

/* ---- Game rail: chips you slide sideways (above the tab bar, never inside a page) ---- */
.rail { grid-area: rail; position: relative; z-index: 5; display: flex; align-items: center; min-width: 0; background: var(--turf); }
.rail ul { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; margin: 0; padding: 4px var(--gut-r) 4px var(--gut-l); list-style: none;
  overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.rail ul::-webkit-scrollbar { display: none; }
.rail li { flex: none; display: flex; }
.gchip { width: 148px; height: 52px; display: grid; align-content: center; gap: 5px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-align: left; white-space: nowrap; overflow: hidden; }
.gchip > *, .chip > *, .tile > * { pointer-events: none; } /* the <button> stays the tap target while its insides refresh */
.gchip .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; font: 700 16px/1 var(--display); letter-spacing: 0.02em; }
.gchip .l1 .sc { overflow: hidden; text-overflow: ellipsis; }
.gchip .at { color: var(--mute); font-weight: 500; }
.gchip .dots { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; flex: none; }
.gchip .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--you); }
.gchip .dots i.opponent { background: var(--opp); }
.gchip .dots b { font: 700 11px/1 var(--display); color: var(--mute); }
.gchip .l2 { font: 600 13px/1 var(--display); letter-spacing: 0.03em; color: var(--mute); overflow: hidden; text-overflow: ellipsis; }
.gchip .l2 .w { color: var(--chalk); }
.gchip.hot { border-color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }
.gchip.hot .l2 .w { color: var(--hot); }
.gchip.post .l1 { color: var(--mute); }
.gchip[aria-current="true"] { background: var(--panel-2); border-color: var(--chalk); box-shadow: inset 0 0 0 1px var(--chalk); }
.gchip.resort { width: 44px; padding: 0; place-items: center; font: 700 22px/1 var(--display); color: var(--chalk); }
.gchip.all { width: auto; padding: 0 14px; font: 600 14px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
@media (hover: hover) { .gchip:hover { border-color: var(--mute); } }
.railnav { display: none; }
@media (hover: hover) and (pointer: fine) {
  .railnav { display: grid; place-items: center; flex: none; width: 32px; height: 52px; margin: 0 2px; padding: 0; background: none; border: 0; border-radius: 8px; font: 700 24px/1 var(--display); color: var(--chalk); }
  .railnav:hover { background: var(--panel); }
  .railnav:disabled { color: var(--line); cursor: default; background: none; }
  .rail ul { padding-inline: 4px; }
}

/* ---- Tabs and pages ---- */
.tabbar { grid-area: tabs; position: relative; z-index: 5; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--turf); border-bottom: 1px solid var(--line); }
.tabbar [role="tab"] { min-height: 44px; padding: 0 8px; background: none; border: 0; font: 600 14px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.tabbar .is-current { color: var(--chalk); }
.ink { position: absolute; left: 0; bottom: -1px; height: 3px; width: calc(100% / var(--ntabs, 3)); background: var(--you); will-change: transform; pointer-events: none; }
.pager { height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
.pager::-webkit-scrollbar { display: none; }
.page { position: relative; flex: 0 0 100%; min-width: 0; height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain;
  scroll-snap-align: start; scroll-snap-stop: always; container-type: inline-size; padding: 0 var(--gut-r) 32px var(--gut-l); }
.page > * { max-width: 680px; margin-inline: auto; }
.page-head { position: sticky; top: 0; z-index: 2; background: var(--turf); padding: 6px 0; }
.page-head:not(:has(> :not(.colhead, [hidden]))) { padding: 0; } /* nothing but a column head (hidden on phones) */
.colhead { display: none; }
.coltitle { margin: 0; font: 700 15px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; }
.top-sentinel { position: absolute; top: 0; left: 0; width: 1px; height: 24px; pointer-events: none; }
.sentinel { height: 1px; }
.boot { position: absolute; inset: 0; z-index: 4; overflow-y: auto; background: var(--turf); padding: 0 var(--gut-r) 32px var(--gut-l); }
.shell.booting .tabbar { visibility: hidden; }
.shell.booting .appbar [data-sheet="find"] { display: none; } /* nothing to search until your league is synced */

/* Wide screens: the tabs become side-by-side columns (the class is set from matchMedia in app.js). */
.shell.dash .tabbar, .shell.dash .pinbar { display: none; }
.shell.dash .pager { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); overflow: hidden; scroll-snap-type: none; }
.shell.dash .page { display: none; scroll-snap-align: none; border-left: 1px solid var(--line); }
.shell.dash .page[data-col] { display: block; grid-row: 1; }
.shell.dash .page[data-col="1"] { grid-column: 1; border-left: 0; }
.shell.dash .page[data-col="2"] { grid-column: 2; }
.shell.dash .page[data-col="3"] { grid-column: 3; }
.shell.dash .page-head { padding: 12px 0 8px; }
.shell.dash .colhead { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.shell.dash .layer { grid-row: main; justify-self: end; width: calc(100% / var(--cols)); border-left: 1px solid var(--line); }
.colpick-slot { margin-left: auto; }
.colpick { display: inline-flex; }
.colpick button { padding: 6px 10px; }

/* ---- Zone ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.shell.dash .filters { margin-top: 10px; }
.chipbtn { position: relative; min-height: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: 600 13px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
.chipbtn::after { content: ""; position: absolute; inset: -6px 0; } /* 44px tap target */
.chipbtn[aria-pressed="true"] { background: var(--chalk); color: var(--turf); border-color: var(--chalk); }
.note { margin: 8px 0 2px; font-size: 13px; color: var(--mute); }
.note button { background: none; border: 0; padding: 0; color: var(--chalk); text-decoration: underline; font: inherit; }
.newpill { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); z-index: 3; white-space: nowrap; background: var(--chalk); color: var(--turf); border: 0; border-radius: 999px; padding: 9px 14px; font: 700 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; box-shadow: 0 6px 20px rgb(0 0 0 / .35); }
.firstrun { display: flex; gap: 12px; align-items: center; margin-block: 4px 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--you); border-radius: 10px; font-size: 13px; color: var(--mute); }
.firstrun p { margin: 0; flex: 1; }
.firstrun b { color: var(--chalk); }

/* ---- Play cards ---- */
.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.play { display: grid; gap: 3px; padding: 10px 14px 11px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; text-align: left; width: 100%; background: none; border-top: 0; border-right: 0;
  content-visibility: auto; contain-intrinsic-size: auto 92px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.play:last-child { border-bottom: 0; }
/* Heads-up banner (M4): one at a time under the tabs; yellow for your player, purple for theirs */
.banner { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--you); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .28); overflow: hidden; animation: bannerIn .22s ease-out; touch-action: none; }
.banner.opponent { border-left-color: var(--opp); }
.banner-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 11px 12px; background: none; border: 0; text-align: left; color: var(--chalk); font: 700 16px/1.2 var(--display); letter-spacing: 0.01em; }
.banner-t { flex: 1; min-width: 0; }
.banner-more { flex: none; font: 600 12px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
.banner-x { flex: none; width: 44px; background: none; border: 0; border-left: 1px solid var(--line); color: var(--mute); font-size: 20px; }
@keyframes bannerIn { from { translate: 0 -12px; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .banner { animation: none; } }
/* Tab badges: a count on Zone, a dot on Matchup */
.tabbar [role="tab"] { position: relative; }
.tbadge { position: absolute; top: 6px; margin-left: 2px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--you); color: var(--turf); font: 700 11px/17px var(--display); letter-spacing: 0; }
.tbadge.dot { min-width: 8px; width: 8px; height: 8px; padding: 0; top: 10px; }
/* Sunday Story (M5): covers everything; tap halves to move, swipe down to close */
.story { grid-row: 1 / -1; grid-column: 1 / -1; z-index: 12; position: relative; display: flex; flex-direction: column; background: radial-gradient(120% 80% at 50% 0%, var(--panel) 0%, var(--turf) 70%); padding: 10px var(--gut-r) 18px var(--gut-l); touch-action: none; }
.story-top { position: relative; z-index: 2; max-width: 560px; width: 100%; margin: 0 auto; }
.story-bars { display: flex; gap: 4px; }
.story-bars span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.story-bars .done, .story-bars .on { background: var(--you); }
.story-head { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.story-head h2 { margin: 0; font: 700 15px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
.story-tap { position: absolute; top: 60px; bottom: 70px; width: 50%; z-index: 1; background: none; border: 0; padding: 0; }
.story-tap.prev { left: 0; } .story-tap.next { right: 0; }
.story-tap:disabled { cursor: default; }
.story-card { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; pointer-events: none; }
.story-kicker { margin: 0; font: 700 22px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--you); }
.story-big { margin: 0; font: 800 clamp(44px, 13vw, 84px)/1 var(--display); color: var(--chalk); overflow-wrap: anywhere; }
.story-line { margin: 0; font: 500 19px/1.35 var(--body, inherit); color: var(--chalk); }
.story-card.s-top .story-line { font: 700 22px/1.3 var(--display); }

.mseg { display: flex; align-items: center; justify-content: space-between; }
.storybtn { margin-left: auto; }
.sharepic { display: block; width: min(100%, 360px); margin: 6px auto 10px; border-radius: 10px; border: 1px solid var(--line); }
/* League (M6) */
.lbody { padding: 4px 0 24px; }
.lmatch { margin: 0 0 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.lmatch.mine { border-color: var(--you); }
.lmhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 0; color: var(--chalk); text-align: left; }
.lteam { display: grid; gap: 2px; min-width: 0; }
.lteam + .lvs + .lteam, .lmhead > .lteam:last-child { text-align: right; }
.lown { font: 600 14px/1.2 var(--display); letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lteam b { font: 700 26px/1 var(--display); }
.lteam small { font-size: 12px; color: var(--mute); }
.lteam.me .lown, .lteam.me b { color: var(--you); } .lteam.opponent .lown, .lteam.opponent b { color: var(--opp); }
.lvs { font: 600 12px/1 var(--display); color: var(--mute); text-transform: uppercase; }
.lbar { height: 4px; margin: 8px 0 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
.lbar span { display: block; height: 100%; background: var(--chalk); }
.lmatch.mine .lbar { background: var(--opp); } .lmatch.mine .lbar span { background: var(--you); }
.lmeta { display: flex; justify-content: space-between; margin: 0; font-size: 12px; color: var(--mute); }
.llineups { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.llineups ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.llineups li { display: flex; justify-content: space-between; gap: 6px; } .llineups li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.llineups + .chipbtn { margin-top: 10px; }
.ltable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ltable th { font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); padding: 8px 6px; text-align: right; }
.ltable td { padding: 10px 6px; border-top: 1px solid var(--line); text-align: right; }
.ltable .tl { text-align: left; }
.ltable tr.me td { color: var(--you); font-weight: 600; } .ltable tr.opponent td { color: var(--opp); }
.lnow { display: inline-block; min-width: 20px; padding: 2px 5px; border-radius: 5px; font: 700 12px/1 var(--display); text-align: center; }
.lnow.W { background: color-mix(in srgb, var(--up) 22%, transparent); color: var(--up); } .lnow.L { background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); }
.moves { list-style: none; margin: 0; padding: 0; }
.moves li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }

.mvtype { grid-row: span 2; align-self: start; font: 700 11px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; background: var(--panel-2); color: var(--mute); }
.mvtype.trade { background: var(--you-tint); color: var(--you); }
/* Free Picks (M7) */

.pk-res.right { color: var(--up); } .pk-res.wrong { color: var(--down); }
.pickslist { display: grid; gap: 8px; padding: 6px 0 24px; }
.pk-score { display: flex; gap: 18px; padding: 10px 2px; font-size: 13px; color: var(--mute); }
.pk-score b { display: block; font: 800 28px/1 var(--display); color: var(--chalk); }
.pickschip[aria-pressed="true"] { background: var(--chalk); color: var(--turf); border-color: var(--chalk); }
/* Game: drives, box, info (M8) */
.drives { list-style: none; margin: 0; padding: 4px 0 20px; }
.drive { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.dteam { font: 700 15px/1 var(--display); color: var(--mute); }
.dmain b { display: block; font: 700 16px/1.2 var(--display); } .dmain small { font-size: 12px; color: var(--mute); }
.drive.score .dmain b { color: var(--hot); }
.dwhen { font-size: 12px; color: var(--mute); }
.boxteam { margin: 6px 0 14px; }
table.box { width: 100%; border-collapse: collapse; font-size: 13px; margin: 4px 0 10px; }
table.box caption { text-align: left; font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); padding: 6px 0; }

.injuries { margin: 4px 0 16px; padding-left: 18px; font-size: 13px; }

/* What-if (M9) */
.wi-top { display: flex; align-items: center; gap: 12px; padding: 8px 2px; position: sticky; top: 0; z-index: 2; background: var(--turf); border-bottom: 1px solid var(--line); }

.wi-top b { font: 800 30px/1.1 var(--display); } .wi-top b.up { color: var(--up); } .wi-top b.down { color: var(--down); }
.wi-arrow { color: var(--mute); font-size: 20px; }
.wi-top .chipbtn { margin-left: auto; }
.wi-list { list-style: none; margin: 0; padding: 0 0 24px; }
.wi-row { display: grid; gap: 6px; padding: 10px 2px 10px 10px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--you); }
.wi-row.opponent { border-left-color: var(--opp); }
.wi-name b { font: 700 16px/1.2 var(--display); } .wi-name small { display: block; font-size: 12px; color: var(--mute); }
.wi-tag { color: var(--chalk); font-weight: 600; }
.wi-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.wi-btns .chipbtn { min-height: 30px; padding: 6px 10px; }
/* Intro and sign-in */
.intro { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; animation: introIn .5s ease-out; }
.intro-field { position: relative; width: 220px; height: 70px; border-radius: 10px; background: linear-gradient(90deg, var(--you-tint), transparent 30%, transparent 70%, var(--opp-tint)); border: 1px solid var(--line); overflow: hidden; display: flex; justify-content: space-evenly; }
.intro-field i { width: 1px; background: var(--line); }
.intro-ball { position: absolute; top: 26px; left: -20px; width: 22px; height: 14px; border-radius: 50%; background: #8a5a2b; box-shadow: inset 0 0 0 2px #6b4320; animation: introBall 1.3s cubic-bezier(.5,.1,.4,1) infinite; }
.intro-logo { margin: 0; font: 800 46px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--chalk); }
.intro-logo b { color: var(--you); }
.intro-tag { margin: 0; color: var(--mute); font-size: 15px; }
.intro-bar { width: 160px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.intro-bar span { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, var(--you), var(--opp)); animation: introBar 1.1s ease-in-out infinite; }
@keyframes introBall { 0% { left: -24px; transform: translateY(0) rotate(0); } 50% { transform: translateY(-22px) rotate(180deg); } 100% { left: 230px; transform: translateY(0) rotate(360deg); } }
@keyframes introBar { 0% { translate: -100% 0; } 100% { translate: 260% 0; } }
@keyframes introIn { from { opacity: 0; scale: .96; } }
@media (prefers-reduced-motion: reduce) { .intro, .intro-ball, .intro-bar span { animation: none; } }
.onboard .go:disabled { opacity: .7; }
.ob-leagues { display: grid; gap: 8px; }
.ob-league { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.ob-league input { width: 20px; height: 20px; accent-color: var(--you); }
.ob-league b { display: block; font: 700 16px/1.2 var(--display); } .ob-league small { color: var(--mute); }
.acct { margin: 6px 0 12px; display: grid; gap: 8px; }
.acct-who { margin: 0; }
.acct-leagues { display: grid; gap: 6px; }
.acct-leagues .setrow[aria-checked="true"] { border-color: var(--you); }
.acct-btns { display: flex; flex-wrap: wrap; gap: 8px; }
/* Starred players */
.starbtn { margin: 6px 0; } .starbtn[aria-pressed="true"] { background: var(--chalk); color: var(--turf); border-color: var(--chalk); }
.banner.star { border-left-color: var(--chalk); }
.starrow { padding: 8px 0; border-bottom: 1px solid var(--line); } .starrow p { margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* Trophies */
.toastbox { grid-row: main-start / main-end; grid-column: 1; align-self: start; justify-self: center; margin-top: 8px; position: relative; z-index: 14; }
.toast { position: relative; overflow: visible; max-width: calc(100vw - 32px); margin: 0; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--you); text-align: center; background: var(--panel); color: var(--chalk); font: 600 15px/1.2 var(--display); box-shadow: 0 8px 24px rgb(0 0 0 / .3); animation: bannerIn .25s ease-out; }
.toast.ok { border-color: var(--up); } .toast.err { border-color: var(--down); } /* "Synced", "Back online" / "Connection lost" */
.toastbox { pointer-events: none; } .toastbox button { pointer-events: auto; } /* a message never blocks a tap; a trophy can be tapped */
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; left: 50%; top: 50%; width: 6px; height: 10px; border-radius: 2px; background: var(--you); animation: confetti 1s ease-out forwards; }
.confetti i:nth-child(odd) { background: var(--opp); } .confetti i:nth-child(3n) { background: var(--up); }
.confetti i:nth-child(1) { --x: -90px; --y: -40px; }
.confetti i:nth-child(2) { --x: 80px; --y: -50px; }
.confetti i:nth-child(3) { --x: -60px; --y: 40px; }
.confetti i:nth-child(4) { --x: 100px; --y: 30px; }
.confetti i:nth-child(5) { --x: -120px; --y: 0px; }
.confetti i:nth-child(6) { --x: 130px; --y: -10px; }
.confetti i:nth-child(7) { --x: -30px; --y: -60px; }
.confetti i:nth-child(8) { --x: 40px; --y: 60px; }
.confetti i:nth-child(9) { --x: -100px; --y: 50px; }
.confetti i:nth-child(10) { --x: 60px; --y: -70px; }
.confetti i:nth-child(11) { --x: 0px; --y: 70px; }
.confetti i:nth-child(12) { --x: 120px; --y: 50px; }
@keyframes confetti { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(540deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 8px 0 14px; }
.trophy { display: grid; gap: 4px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); opacity: .55; }
.trophy.got { opacity: 1; border-color: var(--you); }
.trophy .t-icon { font-size: 28px; } .trophy b { font: 700 16px/1.1 var(--display); } .trophy small { font-size: 12px; color: var(--mute); }
/* Multi-view */
.layer.multi { z-index: 9; grid-row: tabs-start / main-end; display: block; overflow-y: auto; }
.mv-body { padding: 8px var(--gut-r) 24px var(--gut-l); display: grid; gap: 10px; max-width: 1100px; margin: 0 auto; }
.mv-big { padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: grid; gap: 6px; }

.mv-head { display: flex; align-items: center; gap: 8px; }
.mv-title { flex: 1; text-align: left; background: none; border: 0; color: var(--chalk); padding: 0; font: 700 22px/1.1 var(--display); }
.mv-title span { font-size: 15px; color: var(--mute); margin-left: 6px; }
.mv-sit { margin: 0; color: var(--mute); font-size: 13px; }
.mv-who { margin: 0; font-size: 13px; } .mv-who .me { color: var(--you); font-weight: 600; } .mv-who .opponent { color: var(--opp); font-weight: 600; }
.mv-plays { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; } .mv-plays li { padding: 6px 0; border-top: 1px solid var(--line); }
.mv-row { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.mv-small { position: relative; flex: 0 0 min(46%, 220px); scroll-snap-align: start; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.mv-pick { display: grid; gap: 3px; width: 100%; padding: 10px 28px 10px 10px; background: none; border: 0; color: var(--chalk); text-align: left; }
.mv-pick b { font: 700 16px/1.1 var(--display); } .mv-pick span { font-size: 12px; color: var(--mute); } .mv-pick small { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mv-x { position: absolute; top: 2px; right: 2px; width: 32px; height: 32px; background: none; border: 0; color: var(--mute); font-size: 18px; }
.mv-head .mv-x { position: static; }
.mv-add { flex: 0 0 min(46%, 220px); min-height: 80px; border: 1px dashed var(--line); border-radius: 12px; background: none; color: var(--mute); font: 700 15px/1 var(--display); text-transform: uppercase; }
.mv-list { display: flex; flex-wrap: wrap; gap: 6px; }
@media (min-width: 900px) { .mv-body { grid-template-columns: 2fr 1fr; align-items: start; } .mv-row { flex-direction: column; overflow: visible; } .mv-small, .mv-add { flex: none; } .mv-list { grid-column: 1 / -1; } }
/* Menu (☰): go to a section, your Sleeper, extras, switches, and the footer */
.menu-go { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.menu-go button { min-height: 44px; padding: 0 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; font: 700 14px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--chalk); }
.menu-go button[aria-current="page"] { border-color: var(--you); color: var(--you); }
.foot { margin: 0; font-size: 12px; line-height: 1.5; color: var(--mute); text-align: center; }
.boot .foot { max-width: 420px; margin: -14px auto 0; }
/* Settings switches */
.setlist { display: grid; gap: 8px; margin: 8px 0 14px; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; text-align: left; color: var(--chalk); }
.setrow b { display: block; font: 700 16px/1.2 var(--display); }

.setrow span { flex: 1; }
.switch { flex: none; position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--chalk); transition: translate .15s; }
.setrow[aria-checked="true"] .switch { background: var(--you); }
.setrow[aria-checked="true"] .switch::after { translate: 18px 0; background: var(--turf); }
/* Fantasy off: no yellow/purple on the plays */
.nofantasy .pchips .chip.me, .nofantasy .pchips .chip.opponent, .nofantasy .pchips .chip.up, .nofantasy .pchips .chip.down { display: none; }
.nofantasy .play.me, .nofantasy .play.opponent { border-left-color: transparent; }
.play.me { border-left-color: var(--you); }
.play.opponent { border-left-color: var(--opp); }

@keyframes arrive { from { background: var(--panel-2); transform: translateY(-4px); opacity: .4; } }
.pmeta { font: 600 12px/1.2 var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); display: flex; gap: 6px; flex-wrap: wrap; }

.phead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pname { font: 700 19px/1.15 var(--display); letter-spacing: 0.01em; }
.plabel { font: 600 19px/1.15 var(--display); color: var(--mute); }
.play.big .pname, .play.big .plabel { color: var(--hot); }
.badge { font: 700 11px/1 var(--display); letter-spacing: 0.08em; padding: 3px 6px; border-radius: 4px; background: var(--hot); color: #fff; align-self: center; }
.pfrom { font-size: 13px; color: var(--mute); }
.ptext { font-size: 13px; color: var(--mute); line-height: 1.4; }
.play .ptext { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.pchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { font: 600 12px/1 var(--display); letter-spacing: 0.04em; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); color: var(--chalk); white-space: nowrap; }
.chip.me { background: var(--you-tint); color: var(--you); }
.chip.opponent { background: var(--opp-tint); color: var(--opp); }
.chip.up { color: var(--up); } .chip.down { color: var(--down); }
.marker { padding: 8px 14px; font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); text-align: center; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.empty { padding: 22px 16px; margin: 0; color: var(--mute); font-size: 14px; text-align: center; }

/* ---- Matchup: score and win chance, the [Lineup] chip, then the starters face to face ---- */
.mhero { display: grid; gap: 8px; margin-top: 10px; padding: 10px 12px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.mhero .mtop { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 10px; }
.mhero .side { display: grid; gap: 3px; min-width: 0; }
.mhero .side.opp { text-align: right; }
.mhero .who { font: 600 12px/1.1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mhero .pts { font: 700 34px/0.95 var(--display); }
.mhero .side.me .pts { color: var(--you); } .mhero .side.opp .pts { color: var(--opp); }
.mhero .proj { font: 600 12px/1 var(--display); letter-spacing: 0.04em; color: var(--mute); }
.mhero .mid { display: grid; justify-items: center; gap: 4px; padding-bottom: 14px; }
.mhero .mid b { font: 700 26px/1 var(--display); white-space: nowrap; }
.msweat { margin: 0; font-size: 13px; color: var(--mute); line-height: 1.35; }
.sweat { font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: var(--panel-2); color: var(--chalk); margin-right: 4px; }
.mswing { margin: 6px 0 0; font-size: 13px; color: var(--mute); line-height: 1.35; }
.mswing summary { list-style: none; cursor: pointer; } .mswing summary::-webkit-details-marker { display: none; }
.mswing .label { margin-right: 4px; } .mswing .me { color: var(--you); } .mswing .opponent { color: var(--opp); }
.mswing .more { font: 700 11px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk); text-decoration: underline; text-underline-offset: 2px; }
.mswing[open] .more { display: none; } .mswing p { margin: 4px 0 0; }
.sweat.s-full { background: var(--hot); color: #fff; } .sweat.s-sweaty { background: var(--you-tint); color: var(--you); }
.chartbox { margin-top: 10px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.winchart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.swingdot { cursor: pointer; }
.readout { margin: 4px 0 0; min-height: 18px; font: 600 13px/1.3 var(--display); color: var(--mute); }
.mswings > h3 { margin: 14px 0 6px; }
.wpbar { height: 6px; border-radius: 999px; background: var(--opp); overflow: hidden; }
.wpbar span { display: block; height: 100%; background: var(--you); transition: width .5s; }
.delta { font-size: 0.6em; vertical-align: 0.25em; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); }
.mseg { display: flex; margin-top: 10px; }
.mseg .seg button { min-height: 34px; padding: 6px 14px; font-size: 13px; }
.lineup { display: grid; gap: 4px; margin: 10px 0 0; padding: 0; list-style: none; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr); align-items: stretch; min-height: 40px; background: var(--panel); border-radius: 8px; overflow: hidden; }
.lrow .lme, .lrow .lopp { display: grid; align-content: center; gap: 2px; min-width: 0; padding: 3px 8px; }
.lrow .lme { border-left: 3px solid var(--you); }
.lrow .lopp { border-right: 3px solid var(--opp); text-align: right; }
.lrow .l1 { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
.lrow .lopp .l1 { flex-direction: row-reverse; }
.lrow .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 15px/1.1 var(--body); }
.lrow b { flex: none; font: 700 17px/1 var(--display); }
.lrow .lme b { color: var(--you); } .lrow .lopp b { color: var(--opp); }
.lrow .mk { flex: none; width: 12px; text-align: center; font: 700 12px/1 var(--body); font-style: normal; color: var(--mute); }
.lrow .st-in .mk { color: var(--chalk); }
.lrow .lme.st-ball .mk { color: var(--you); } .lrow .lopp.st-ball .mk { color: var(--opp); }
.lrow .l2 { font: 500 12px/1.1 var(--display); letter-spacing: 0.03em; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .st-pre .nm, .lrow .st-none .nm { color: var(--mute); }
.lrow .lpos { display: grid; place-items: center; font: 700 12px/1 var(--display); letter-spacing: 0.06em; color: var(--mute); background: var(--panel-2); }

/* ---- Games: chips, sort, then a grid of tiles ---- */
.sortrow { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-height: 40px; }
.sortrow .seg button { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.sortrow .resort { margin-left: auto; min-width: 44px; font-size: 17px; padding: 6px 12px; color: var(--chalk); }
.tiles { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px; }
@container (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container (min-width: 760px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tiles > .empty { grid-column: 1 / -1; }
.tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; display: grid; gap: 6px; align-content: start; min-width: 0; }
@media (hover: hover) { .tile:hover { border-color: var(--mute); } }
.tile.hot { border-color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }
.tile .row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.tile .teams { font: 700 19px/1 var(--display); letter-spacing: 0.02em; white-space: nowrap; }
.tile .teams .at { color: var(--mute); font-weight: 500; }
.tile .meta { font: 600 12px/1.25 var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); }
.tile .who { font: 600 14px/1.2 var(--display); letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .who .me { color: var(--you); } .tile .who .opponent { color: var(--opp); }
.tile .why { font-size: 12px; color: var(--mute); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.post .teams { color: var(--mute); } .tile.post .teams b { color: var(--chalk); }
.stakebar { height: 4px; border-radius: 999px; background: var(--opp); overflow: hidden; }
.stakebar span { display: block; height: 100%; background: var(--you); }
.stakebar.none { background: var(--line); }
.tile .flame { font: 700 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--hot); white-space: nowrap; }

/* ---- Game layer (covers the tabs; on wide screens only the last column) ---- */
.layer { grid-row: tabs-start / main-end; grid-column: 1; z-index: 8; min-height: 0; background: var(--turf); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.layer .subtabs { grid-area: auto; }
.sheet-play { color: var(--mute); font-size: 14px; }
.findbox { width: 100%; font: 500 17px/1.2 var(--body); padding: 11px 12px; margin-top: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk); }
.findlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.findrow { width: 100%; min-height: 48px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; }
.findrow.me { border-left-color: var(--you); } .findrow.opponent { border-left-color: var(--opp); }
.findrow b { font: 700 17px/1.2 var(--display); } .findrow span { font-size: 13px; color: var(--mute); }
.findrow > * { pointer-events: none; }
.sheet-feed { margin-top: 10px; }
.filters .when { margin-left: auto; }
#page-zone .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px 0; margin: -6px 0; } /* one row, swipe sideways */
#page-zone .filters::-webkit-scrollbar { display: none; }
#page-zone .filters > * { flex: none; }
#page-zone .fchips { display: flex; gap: 8px; }
.onfield { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.onfield .label { flex: none; margin-right: 2px; }
.ofchip { flex: none; display: inline-flex; gap: 5px; align-items: baseline; min-height: 28px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--chalk); font: 700 14px/1 var(--display); letter-spacing: 0.02em; }
.ofchip small { font-size: 11px; color: var(--mute); letter-spacing: 0.06em; }
.ofchip.me { border-color: var(--you); box-shadow: inset 3px 0 0 var(--you); }
.ofchip.opponent { border-color: var(--opp); box-shadow: inset 3px 0 0 var(--opp); }
.ofchip.red { background: color-mix(in srgb, var(--down) 18%, var(--panel)); }
.filters .when select { height: 34px; max-width: 150px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--chalk); font: 600 13px/1 var(--display); letter-spacing: 0.04em; }
.breakdown { border-left: 3px solid var(--line); padding: 6px 0 6px 10px; margin-block: 10px; }
.breakdown.me { border-left-color: var(--you); } .breakdown.opponent { border-left-color: var(--opp); }
.breakdown h3 { display: flex; justify-content: space-between; gap: 10px; margin: 0 0 4px; font: 700 17px/1.2 var(--display); }
.breakdown h3 small { color: var(--mute); font-weight: 600; }
.breakdown ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 14px; }
.breakdown li { display: flex; justify-content: space-between; gap: 10px; color: var(--mute); }
.breakdown li b { color: var(--chalk); } .breakdown li b.neg { color: var(--down); }
.sheet-win { font: 600 15px/1.3 var(--display); letter-spacing: 0.02em; }
.layer .subpager { min-height: 0; }
.gguys, .gmomentum { padding-top: 10px; }
.layer-head { display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 0 var(--gut-r) 0 calc(var(--gut-l) - 8px); border-bottom: 1px solid var(--line); }
.layer .back { font-size: 28px; font-weight: 500; }
.layer .back .dk, .shell.dash .layer .back .ph { display: none; }
.shell.dash .layer .back .dk { display: inline; }
.gtitle { flex: 1 1 auto; min-width: 0; display: grid; gap: 3px; }
.gtitle h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.gtitle .gt-name { font: 700 19px/1 var(--display); letter-spacing: 0.03em; overflow: hidden; text-overflow: ellipsis; }
.gtitle .gt-clock { flex: none; font: 600 14px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--mute); }
.gtitle .gt-sub { margin: 0; font: 600 12px/1 var(--display); letter-spacing: 0.04em; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gtitle .gt-sub:empty { display: none; }
.gnav { flex: none; }
.gnav button { min-height: 34px; min-width: 38px; padding: 0 8px; display: inline-grid; place-items: center; color: var(--chalk); position: relative; }
.gnav button::after { content: ""; position: absolute; inset: -5px 0; } /* 44px tap target */
.gnav button:disabled { color: var(--line); cursor: default; }
.layer-field { padding: 6px var(--gut-r) 6px var(--gut-l); border-bottom: 1px solid var(--line); }
.layer-field > * { max-width: 680px; margin-inline: auto; }
.layer-body { position: relative; overflow-y: auto; overscroll-behavior-y: contain; padding: 0 var(--gut-r) 32px var(--gut-l); }
.layer-body > * { max-width: 680px; margin-inline: auto; }
.layer-body > .section-title, .gguys > .section-title { margin-block: 12px 6px; }
.layer-pillbar { position: sticky; top: 0; z-index: 3; height: 0; }
.layer-pillbar .newpill { top: 8px; }
.gmomentum:not(:empty) { margin-top: 12px; }
.gmomentum .momentum { max-height: 64px; }
.gguys .stake { padding: 6px 10px; }
.gguys .stake .now { font-size: 17px; }
@media (prefers-reduced-motion: no-preference) { .layer.opening { animation: slidein .22s ease-out; } }
@keyframes slidein { from { transform: translateX(24px); opacity: .3; } }
.col { display: grid; gap: 14px; min-width: 0; align-content: start; }
.field, .momentum { width: 100%; height: auto; display: block; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; }
.stakes { display: grid; gap: 6px; }
.stake { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border-left: 3px solid var(--line); }
.stake.me { border-left-color: var(--you); } .stake.opponent { border-left-color: var(--opp); }
.stake .pos { font: 700 12px/1 var(--display); letter-spacing: 0.06em; color: var(--mute); }
.stake .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stake .who small { color: var(--mute); }
.stake .now { font: 700 19px/1 var(--display); }
.stake .left { font-size: 12px; color: var(--mute); text-align: right; line-height: 1.2; }

/* ---- Sheets (bottom sheet on phones, a centered dialog on wide screens) ---- */
.backdrop { position: absolute; inset: 0; z-index: 12; background: rgb(0 0 0 / .5); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 13; max-height: 85%; overflow-y: auto; overscroll-behavior-y: contain;
  display: grid; gap: 12px; padding: 0 var(--gut-r) 20px var(--gut-l); background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgb(0 0 0 / .3); }
.sheet > * { margin: 0; }
.sheet .handle { display: grid; place-items: center; height: 22px; margin-bottom: -6px; touch-action: none; cursor: grab; }
.sheet .handle span { width: 40px; height: 4px; border-radius: 999px; background: var(--line); }
.sheet-title { font: 700 22px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.sheet-clock { font: 700 26px/1 var(--display); letter-spacing: 0.02em; }
.sheet-note { font-size: 13px; color: var(--mute); }
.sheet-note b { color: var(--chalk); }
.sheet .label { margin-bottom: -4px; }
.jumps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.jump { display: grid; gap: 4px; justify-items: center; min-height: 52px; padding: 8px 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
.jump b { font: 700 17px/1 var(--display); }
.jump small { font-size: 11px; color: var(--mute); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
.sheet-actions .go { padding: 10px 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { min-height: 40px; background: none; border: 0; padding: 7px 12px; font: 600 14px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--turf); }
.seg button + button { border-left: 1px solid var(--line); }
.appbar .seg button { min-height: 32px; padding: 0 9px; }
.appbar .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--chalk); }
@media (min-width: 900px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 12%; width: min(520px, 100% - 32px); max-height: 76%; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 14px; padding-top: 14px; }
  .sheet .handle { display: none; }
}

/* ---- Setup (live mode, first time) ---- */
.setup { max-width: 420px; margin: 32px auto; padding: 20px; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.setup h1 { font: 700 30px/1 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.setup p { margin: 0; color: var(--mute); }
.setup input { font: 400 16px/1.2 var(--body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk); }
.go { background: var(--you); color: var(--you-ink); border: 0; border-radius: 8px; padding: 11px; font: 700 16px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.setup .err { color: var(--down); font-size: 13px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
