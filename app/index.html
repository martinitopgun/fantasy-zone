<title>Fantasy Zone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e1411">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a night-game control room. The Zone is a live feed of play cards (newest on top) under your
   matchup and the hottest games; a game screen holds one game's field, momentum and plays.
   On wide screens the Zone and a game sit side by side. */
:root {
  --turf: #0e1411; --panel: #161f1a; --panel-2: #1c2721; --line: #2a372f;
  --chalk: #e8eee9; --mute: #8d9c92; --field: #1d3527; --field-line: #2f4c3a;
  --you: #f2c230; --you-ink: #1a1400; --you-tint: rgb(242 194 48 / .14);
  --opp: #ab8cf6; --opp-tint: rgb(171 140 246 / .14);
  --up: #43d17e; --down: #f2645d; --hot: #ff5a4e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --turf: #f2f5f1; --panel: #ffffff; --panel-2: #f5f8f4; --line: #d9e1da;
  --chalk: #111a14; --mute: #56665b; --field: #d6e9da; --field-line: #b4d2bb;
  --you: #a87b00; --you-ink: #fffbea; --you-tint: rgb(168 123 0 / .12);
  --opp: #6a4bd3; --opp-tint: rgb(106 75 211 / .1);
  --up: #13894a; --down: #c7372f; --hot: #d42a1f; color-scheme: light; } }
:root[data-theme="light"] {
  --turf: #f2f5f1; --panel: #ffffff; --panel-2: #f5f8f4; --line: #d9e1da;
  --chalk: #111a14; --mute: #56665b; --field: #d6e9da; --field-line: #b4d2bb;
  --you: #a87b00; --you-ink: #fffbea; --you-tint: rgb(168 123 0 / .12);
  --opp: #6a4bd3; --opp-tint: rgb(106 75 211 / .1);
  --up: #13894a; --down: #c7372f; --hot: #d42a1f; color-scheme: light; }

html, body { min-height: 100%; }
body { background: var(--turf); color: var(--chalk); font: 15px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--turf); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.label { font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }

/* ---- Header ---- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--turf); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; min-height: 52px; }
.navbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font: 600 14px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.navbtn .arrow { font-size: 18px; line-height: 0.6; }
.brand { font: 700 21px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--you); }
.spacer { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); padding: 5px 8px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.status.live i { background: var(--hot); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (max-width: 520px) { .brand { display: none; } }

/* ---- Replay bar ---- */
.replaybar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.replaybar .what { font-size: 13px; color: var(--mute); min-width: 0; flex: 1 1 260px; }
.replaybar .what b { color: var(--chalk); font-weight: 600; }
.replaybar .clock { font: 700 18px/1 var(--display); letter-spacing: 0.04em; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 10px; font: 600 13px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--chalk); }
.seg button + button { border-left: 1px solid var(--line); }

/* ---- Zone ---- */
.zone { display: grid; gap: 14px; padding-block: 14px 40px; }
@media (min-width: 1000px) {
  .zone.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: start; }
  .zone.split .deskpanel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 80px); overflow: auto; }
}
.col { display: grid; gap: 14px; min-width: 0; align-content: start; }

.matchup { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.matchup .top { display: flex; justify-content: space-between; gap: 10px; }
.matchup .side { display: grid; gap: 2px; min-width: 0; }
.matchup .side.opp { text-align: right; }
.matchup .who { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.matchup .pts { font: 700 30px/1 var(--display); }
.matchup .side.me .pts { color: var(--you); } .matchup .side.opp .pts { color: var(--opp); }
.matchup .mid { text-align: center; align-self: center; }
.matchup .mid b { display: block; font: 700 24px/1 var(--display); }
.wpbar { height: 6px; border-radius: 999px; background: var(--opp); overflow: hidden; }
.wpbar span { display: block; height: 100%; background: var(--you); transition: width .5s; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); }

.hot-head { display: flex; justify-content: space-between; align-items: baseline; }
.linkbtn { background: none; border: 0; padding: 4px 0; font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile:hover { border-color: var(--mute); }
.tile.hot { border-color: var(--hot); }
.tile.active { box-shadow: 0 0 0 2px var(--chalk) inset; }
.tile .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tile .teams { font: 700 20px/1 var(--display); letter-spacing: 0.02em; white-space: nowrap; }
.tile .teams .at { color: var(--mute); font-weight: 500; }
.tile .meta { font: 600 12px/1.25 var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); }
.tile .why { font-size: 13px; color: var(--mute); line-height: 1.35; }
.tile .flame { font: 700 13px/1 var(--display); color: var(--hot); white-space: nowrap; }
.meter { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--you); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chipbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: 600 13px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
.chipbtn[aria-pressed="true"] { background: var(--chalk); color: var(--turf); border-color: var(--chalk); }

/* ---- Play cards ---- */
.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.play { display: grid; gap: 4px; padding: 11px 14px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; text-align: left; width: 100%; background: none; border-top: 0; border-right: 0; }
.play:last-child { border-bottom: 0; }
.play.me { border-left-color: var(--you); }
.play.opponent { border-left-color: var(--opp); }
.play.new { animation: arrive .6s ease-out; }
@keyframes arrive { from { background: var(--panel-2); transform: translateY(-4px); opacity: .4; } }
.pmeta { font: 600 12px/1.2 var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); display: flex; gap: 6px; flex-wrap: wrap; }
.pmeta .score b { color: var(--chalk); }
.phead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pname { font: 700 19px/1.15 var(--display); letter-spacing: 0.01em; }
.plabel { font: 600 19px/1.15 var(--display); color: var(--mute); }
.play.big .pname, .play.big .plabel { color: var(--hot); }
.badge { font: 700 11px/1 var(--display); letter-spacing: 0.08em; padding: 3px 6px; border-radius: 4px; background: var(--hot); color: #fff; align-self: center; }
.pfrom { font-size: 13px; color: var(--mute); }
.ptext { font-size: 13px; color: var(--mute); line-height: 1.4; }
.pchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { font: 600 12px/1 var(--display); letter-spacing: 0.04em; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); color: var(--chalk); white-space: nowrap; }
.chip.me { background: var(--you-tint); color: var(--you); }
.chip.opponent { background: var(--opp-tint); color: var(--opp); }
.chip.up { color: var(--up); } .chip.down { color: var(--down); }
.marker { padding: 8px 14px; font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); text-align: center; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.more { width: 100%; background: var(--panel-2); border: 0; padding: 12px; font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.empty { padding: 22px 16px; color: var(--mute); font-size: 14px; text-align: center; }
.newpill { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 66px); z-index: 6; background: var(--chalk); color: var(--turf); border: 0; border-radius: 999px; padding: 8px 14px; font: 700 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; box-shadow: 0 6px 20px rgb(0 0 0 / .35); }

/* ---- Game screen / panel ---- */
.game { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 14px; min-width: 0; }
.scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.team { display: grid; gap: 2px; }
.team.home { text-align: right; }
.team .abbr { font: 700 clamp(26px, 6vw, 40px)/1 var(--display); display: inline-flex; gap: 8px; align-items: center; }
.team.home .abbr { justify-content: flex-end; }
.team .pts { font: 700 clamp(38px, 9vw, 58px)/0.9 var(--display); }
.ballmark { width: 10px; height: 10px; border-radius: 50%; background: var(--you); display: inline-block; }
.gclock { text-align: center; font: 600 14px/1.25 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
.gclock b { display: block; font-size: 22px; color: var(--chalk); }
.situation { font: 600 17px/1.2 var(--display); letter-spacing: 0.03em; text-align: center; }
.field, .momentum { width: 100%; height: auto; display: block; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; }
.stakes { display: grid; gap: 6px; }
.stake { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border-left: 3px solid var(--line); }
.stake.me { border-left-color: var(--you); } .stake.opponent { border-left-color: var(--opp); }
.stake .pos { font: 700 12px/1 var(--display); letter-spacing: 0.06em; color: var(--mute); }
.stake .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stake .who small { color: var(--mute); }
.stake .now { font: 700 19px/1 var(--display); }
.stake .left { font-size: 12px; color: var(--mute); text-align: right; line-height: 1.2; }
.elsewhere { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--you); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
.elsewhere.opponent { border-left-color: var(--opp); }
.elsewhere span { flex: 1; min-width: 0; }

/* ---- All games ---- */
.allgames { display: grid; gap: 16px; padding-block: 14px 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }

/* ---- Setup ---- */
.setup { max-width: 420px; margin: 40px auto; padding: 20px; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.setup h1 { font: 700 30px/1 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.setup p { margin: 0; color: var(--mute); }
.setup input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk); }
.setup .go { background: var(--you); color: var(--you-ink); border: 0; border-radius: 8px; padding: 11px; font: 700 16px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.setup .err { color: var(--down); font-size: 13px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <button class="navbtn" id="nav" type="button" hidden></button>
    <div class="brand">Fantasy <b>Zone</b></div>
    <span class="spacer"></span>
    <span class="status" id="status"><i></i><span>Loading</span></span>
  </div>
</header>
<div class="wrap" id="replaybar" hidden></div>
<div class="wrap" id="root"><p class="empty">Loading…</p></div>
<button class="newpill" id="newpill" type="button" hidden></button>
<script type="module" src="app.js"></script>
